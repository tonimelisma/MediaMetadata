# Weekly update proposals, one grouped pull request per ecosystem. Security updates open right
# away regardless. Actions are pinned by commit SHA with a `# vX.Y.Z` comment, which Dependabot
# keeps up to date. The package has no Swift dependencies today; the swift entry covers any added.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      swift-packages:
        patterns: ["*"]
