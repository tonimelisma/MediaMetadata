# Tags and releases every commit that lands on main and passes CI: a library release, a tag and
# generated notes, nothing built. This is the only workflow that creates tags or releases.
#
# The version is the next patch in the series VERSION names (major.minor): the highest existing
# X.Y.Z tag in that series plus one, or X.Y.0 for a new series. A commit that already carries a
# version tag is skipped, so a re-run never releases twice. Tags have no `v` prefix.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions: {}

# One release at a time, so two runs can never claim the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and release
    # Only CI runs for pushes to main: the weekly scheduled run and pull request runs complete
    # the same workflow and must not release. A dispatch releases main's head.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Choose the commit
        id: commit
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          MAIN_SHA: ${{ github.sha }}
        run: echo "sha=${RUN_SHA:-$MAIN_SHA}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.commit.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Choose the version
        id: version
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          series="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$series" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::VERSION must hold a series like 0.9, got '$series'"
            exit 1
          fi
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          tagged="$(git tag --points-at "$SHA" | grep -E "$semver" | head -n 1 || true)"
          if [[ -n "$tagged" ]]; then
            echo "$SHA is already released as $tagged; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          highest="$(git tag | grep -E "$semver" | sort -V | tail -n 1 || true)"
          if [[ -n "$highest" && "$(printf '%s\n%s.0\n' "$highest" "$series" | sort -V | tail -n 1)" == "$highest" \
                && "${highest%.*}" != "$series" ]]; then
            echo "::error::VERSION series $series is below the highest tag $highest"
            exit 1
          fi
          last="$(git tag | grep -E "^${series//./\\.}\.(0|[1-9][0-9]*)$" | sort -V | tail -n 1 || true)"
          if [[ -n "$last" ]]; then
            version="$series.$(( ${last##*.} + 1 ))"
          else
            version="$series.0"
          fi
          echo "commit $SHA, series $series, highest tag ${highest:-none}, releasing $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Tag and release
        if: steps.version.outputs.skip == 'false'
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" --title "$VERSION" --target "$SHA" --generate-notes
          echo "Released $VERSION at $SHA."
